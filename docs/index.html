<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Component Planner</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <div class="app-shell">
    <div class="storage-controls-shell">
      <div class="storage-controls">
        <button type="button" id="export-components-button" class="action-button">
          Export
        </button>
        <button type="button" id="import-components-button" class="action-button">
          Import
        </button>
        <button type="button" id="cancel-components-import-button" class="action-button hidden">Cancel</button>
        <textarea id="component-import-textarea" class="hidden" placeholder="Paste exported component JSON here"
          spellcheck="false"></textarea>
        <div id="component-import-error-text" class="storage-error hidden" aria-live="polite"></div>
        <div class="header-composer">
          <div class="input-row">
            <input id="create-or-rename-component-input" type="search" placeholder="Component Name" autocomplete="off"
              spellcheck="false" />
            <div class="accordion-controls" aria-label="Accordion controls">
              <button type="button" id="expand-all-component-table-rows-button" class="action-button accordion-control" aria-label="Expand all"
                title="Expand all">
                ︾
              </button>
              <button type="button" id="collapse-all-component-table-rows-button" class="action-button accordion-control" aria-label="Collapse all"
                title="Collapse all">
                ︽
              </button>
            </div>
          </div>
          <div id="input-mode-hint" class="input-mode-hint">Type to filter. Press enter to create.</div>
        </div>
      </div>
    </div>

    <main class="content" aria-live="polite">
      <div id="empty-components-table" class="empty-components-table hidden">
        Use the Input Field above to name the components you'll need to plan!
      </div>

      <table id="components-table" class="components-table" aria-label="Component list">
        <thead>
          <tr>
            <th scope="col">Component</th>
            <th scope="col" style="width: 7.5rem; text-align: right;">Actions</th>
          </tr>
        </thead>
        <tbody id="components-table-body"></tbody>
      </table>
    </main>
  </div>

  <script src="index.js"></script>
</body>

</html>
