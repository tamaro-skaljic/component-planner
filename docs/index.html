<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Component Planner</title>
    <style>
      :root {
        --bg: #101418;
        --bg-panel: #171d24;
        --bg-soft: #1d2530;
        --bg-header: #202b36;
        --bg-row: #131a21;
        --bg-row-alt: #1a222d;
        --bg-edit-soft: #d5dbe3;
        --border: #2c3a46;
        --text: #edf3f8;
        --muted: #b7c3cf;
        --placeholder: #8fa1b1;
        --accent: #89a7c6;
        --shadow: rgba(0, 0, 0, 0.32);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        display: flex;
        overflow: hidden;
      }

      .app-shell {
        width: 100%;
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        overflow: hidden;
      }

      .content {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
        padding: 1rem 0.75rem 0;
      }

      .empty-state {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100%;
        padding: 1rem;
        text-align: center;
        color: var(--muted);
        font-size: 1rem;
        line-height: 1.5;
      }

      .hidden {
        display: none !important;
      }

      .storage-controls-shell {
        position: sticky;
        top: 0;
        left: 0;
        flex-shrink: 0;
        z-index: 10;
        background: rgba(16, 20, 24, 0.96);
        backdrop-filter: blur(2px);
        padding: 0.75rem 0.75rem 0;
        border-bottom: 1px solid var(--border);
      }

      .storage-controls {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        margin: 0 auto;
        max-width: 44rem;
        padding-bottom: 0.75rem;
      }

      .header-composer {
        width: 100%;
        margin-top: 0.25rem;
      }

      .storage-controls textarea {
        width: 100%;
        min-height: 8rem;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--bg-panel);
        color: var(--text);
        padding: 0.85rem 0.9rem;
        font: inherit;
        resize: vertical;
      }

      .storage-error {
        width: 100%;
        color: #ff9a9a;
        font-size: 0.85rem;
      }

      .storage-error ul {
        margin: 0;
        padding-left: 1.2rem;
      }

      .components-table {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        overflow: hidden;
        background: var(--bg-panel);
        box-shadow: 0 0.5rem 1.25rem var(--shadow);
      }

      th,
      td {
        padding: 0.75rem 0.65rem;
        text-align: left;
        vertical-align: middle;
      }

      thead th {
        background: var(--bg-header);
        color: var(--text);
        font-weight: 700;
        border-bottom: 1px solid var(--border);
      }

      tbody tr:nth-child(even) {
        background: var(--bg-row-alt);
      }

      tbody tr:nth-child(odd) {
        background: var(--bg-row);
      }

      tbody tr.is-editing {
        background: var(--bg-edit-soft);
        color: #0d1420;
      }

      tbody tr.is-editing td {
        color: #0d1420;
      }

      .name-cell {
        min-width: 0;
      }

      .name-scroll {
        display: block;
        width: 100%;
        white-space: normal;
        overflow-wrap: anywhere;
        word-break: break-word;
      }

      .component-name {
        display: block;
      }

      .actions {
        display: flex;
        gap: 0.4rem;
        justify-content: flex-end;
        flex-wrap: nowrap;
      }

      .action-btn {
        border: 1px solid var(--border);
        background: var(--bg-soft);
        color: var(--text);
        border-radius: 0.35rem;
        font-weight: 700;
        font-size: 0.9rem;
        padding: 0.38rem 0.7rem;
        cursor: pointer;
        transition: opacity 0.15s ease;
      }

      .action-btn:hover,
      .action-btn:focus-visible {
        opacity: 0.85;
      }

      .action-btn.edit {
        min-width: 2.2rem;
      }

      .action-btn.delete {
        min-width: 2.2rem;
      }

      .field-label {
        display: block;
        font-size: 0.8rem;
        font-weight: 700;
        color: var(--muted);
        margin-bottom: 0.45rem;
      }

      .input-wrap {
        width: 100%;
      }

      input[type="text"] {
        width: 100%;
        border: 1px solid var(--border);
        border-radius: 0.5rem;
        background: var(--bg-panel);
        color: var(--text);
        padding: 0.85rem 0.9rem;
        font-size: 1rem;
        line-height: 1.4;
        outline: none;
      }

      input[type="text"]::placeholder {
        color: var(--placeholder);
      }

      input[type="text"]:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 2px rgba(137, 167, 198, 0.2);
      }

      .mode-hint {
        margin-top: 0.45rem;
        min-height: 1.25rem;
        color: var(--muted);
        font-size: 0.72rem;
      }

      @media (min-width: 640px) {
        .content {
          padding: 1.25rem 1rem 0;
        }

        .storage-controls-shell {
          padding: 0.85rem 1rem 0;
        }

      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <div class="storage-controls-shell">
        <div class="storage-controls">
          <button type="button" id="export-components-btn" class="action-btn">
            Export
          </button>
          <button type="button" id="import-components-btn" class="action-btn">
            Import
          </button>
          <button type="button" id="import-cancel-btn" class="action-btn hidden">Cancel</button>
          <textarea
            id="import-textarea"
            class="hidden"
            placeholder="Paste exported component JSON here"
            spellcheck="false"
          ></textarea>
          <div id="import-error" class="storage-error hidden" aria-live="polite"></div>
          <div class="header-composer">
            <label class="field-label" for="create-or-rename-component">Component Name</label>
            <div class="input-wrap">
              <input
                id="create-or-rename-component"
                type="text"
                placeholder="Add a component name"
                autocomplete="off"
                spellcheck="false"
              />
            </div>
            <div id="mode-hint" class="mode-hint">Type to filter. Press enter to create.</div>
          </div>
        </div>
      </div>

      <main class="content" aria-live="polite">
        <div id="empty-state" class="empty-state hidden">
          Use the Input Field below to name the components you'll need to plan!
        </div>

        <table id="components-table" class="components-table" aria-label="Component list">
          <thead>
            <tr>
              <th scope="col">Component Name</th>
              <th scope="col" style="width: 7.5rem; text-align: right;">Actions</th>
            </tr>
          </thead>
          <tbody id="components-body"></tbody>
        </table>
      </main>
    </div>

    <script>
      const STORAGE_KEY = 'components';

      const state = {
        components: [],
        inputValue: '',
        editingOriginalName: null,
      };

      const inputEl = document.getElementById('create-or-rename-component');
      const hintEl = document.getElementById('mode-hint');
      const tableEl = document.getElementById('components-table');
      const emptyStateEl = document.getElementById('empty-state');
      const tbodyEl = document.getElementById('components-body');
      const exportBtn = document.getElementById('export-components-btn');
      const importBtn = document.getElementById('import-components-btn');
      const importCancelBtn = document.getElementById('import-cancel-btn');
      const importTextarea = document.getElementById('import-textarea');
      const importErrorEl = document.getElementById('import-error');

      function sanitizeInputValue(rawValue) {
        return String(rawValue ?? '')
          .replace(/[^A-Za-z\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .replace(/^\s+/, '');
      }

      function formatInputValue(rawValue) {
        const sanitized = sanitizeInputValue(rawValue);
        const hasTrailingSpace = sanitized.endsWith(' ');
        const trimmed = sanitized.trim();

        if (!trimmed) {
          return '';
        }

        const formatted = trimmed
          .split(' ')
          .filter(Boolean)
          .map((word) => word.charAt(0).toUpperCase() + word.slice(1).toLowerCase())
          .join(' ');

        return hasTrailingSpace ? `${formatted} ` : formatted;
      }

      function normalizeName(rawValue) {
        const sanitized = formatInputValue(rawValue).trim();

        if (!sanitized) {
          return '';
        }

        return sanitized;
      }

      function sortComponents(list) {
        return [...list].sort((left, right) =>
          left.localeCompare(right, undefined, { sensitivity: 'base' })
        );
      }

      function saveComponents() {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state.components));
      }

      function loadComponents() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            state.components = [];
            return;
          }

          const parsed = JSON.parse(raw);
          if (!Array.isArray(parsed)) {
            state.components = [];
            return;
          }

          const cleaned = parsed
            .map((value) => normalizeName(value))
            .filter(Boolean)
            .reduce((accumulator, value) => {
              const key = value.toLowerCase();
              if (!accumulator.has(key)) {
                accumulator.set(key, value);
              }
              return accumulator;
            }, new Map())
            .values();

          state.components = sortComponents(Array.from(cleaned));
        } catch (error) {
          state.components = [];
        }
      }

      function copyToClipboard(text) {
        if (navigator.clipboard?.writeText) {
          return navigator.clipboard.writeText(text);
        }

        const tempTextarea = document.createElement('textarea');
        tempTextarea.value = text;
        document.body.appendChild(tempTextarea);
        tempTextarea.select();
        document.execCommand('copy');
        document.body.removeChild(tempTextarea);
        return Promise.resolve();
      }

      function showImportError(messages) {
        importErrorEl.innerHTML = '';
        const list = document.createElement('ul');

        messages.forEach((message) => {
          const listItem = document.createElement('li');
          listItem.textContent = message;
          list.appendChild(listItem);
        });

        importErrorEl.appendChild(list);
        importErrorEl.classList.remove('hidden');
      }

      function hideImportError() {
        importErrorEl.innerHTML = '';
        importErrorEl.classList.add('hidden');
      }

      function openImportArea() {
        importTextarea.value = '';
        importTextarea.classList.remove('hidden');
        importCancelBtn.classList.remove('hidden');
        hideImportError();
        requestAnimationFrame(() => {
          importTextarea.focus();
        });
      }

      function closeImportArea() {
        importTextarea.value = '';
        importTextarea.classList.add('hidden');
        importCancelBtn.classList.add('hidden');
        hideImportError();
      }

      function attemptImport() {
        let parsed;

        try {
          parsed = JSON.parse(importTextarea.value);
        } catch (error) {
          showImportError(['Pasted text is not valid JSON.']);
          return;
        }

        if (!Array.isArray(parsed)) {
          showImportError(['Data must be a JSON array.']);
          return;
        }

        const structureErrors = [];
        const normalizedComponents = [];

        parsed.forEach((value, index) => {
          if (typeof value !== 'string') {
            structureErrors.push(
              `Item ${index} (${JSON.stringify(value)}) is not a string.`
            );
            return;
          }

          const normalized = normalizeName(value);
          if (!normalized) {
            structureErrors.push(`Item ${index} does not contain a valid component name.`);
            return;
          }

          normalizedComponents.push(normalized);
        });

        if (structureErrors.length > 0) {
          showImportError(structureErrors);
          return;
        }

        state.components = sortComponents(
          Array.from(
            normalizedComponents.reduce((accumulator, value) => {
              const key = value.toLowerCase();
              if (!accumulator.has(key)) {
                accumulator.set(key, value);
              }
              return accumulator;
            }, new Map()).values()
          )
        );
        state.editingOriginalName = null;
        state.inputValue = '';
        saveComponents();
        closeImportArea();
        render();
        inputEl.focus();
      }

      function matchesFilter(value, filterText) {
        const normalizedFilter = normalizeName(filterText);
        if (!normalizedFilter) {
          return true;
        }

        const words = normalizedFilter.toLowerCase().split(/\s+/).filter(Boolean);
        const lowerValue = value.toLowerCase();

        return words.every((word) => lowerValue.includes(word));
      }

      function getVisibleComponents() {
        if (state.editingOriginalName) {
          return sortComponents(state.components);
        }

        const filterText = state.inputValue;
        if (!filterText) {
          return sortComponents(state.components);
        }

        return sortComponents(
          state.components.filter((name) => matchesFilter(name, filterText))
        );
      }

      function syncInputValue() {
        if (inputEl.value !== state.inputValue) {
          inputEl.value = state.inputValue;
        }
      }

      function updateHint() {
        hintEl.textContent = state.editingOriginalName
          ? 'Press enter to rename.'
          : 'Type to filter. Press enter to create.';
      }

      function renderTable() {
        const visible = getVisibleComponents();
        tbodyEl.innerHTML = '';

        visible.forEach((name, index) => {
          const row = document.createElement('tr');
          if (state.editingOriginalName === name) {
            row.classList.add('is-editing');
          }

          const nameCell = document.createElement('td');
          nameCell.className = 'name-cell';

          const nameWrap = document.createElement('span');
          nameWrap.className = 'name-scroll';

          const nameText = document.createElement('span');
          nameText.className = 'component-name';
          nameText.textContent = name;

          nameWrap.appendChild(nameText);
          nameCell.appendChild(nameWrap);

          const actionCell = document.createElement('td');
          actionCell.className = 'actions';

          const editButton = document.createElement('button');
          editButton.type = 'button';
          editButton.className = 'action-btn edit';
          editButton.textContent = 'E';
          editButton.setAttribute('aria-label', `Edit ${name}`);
          editButton.dataset.action = 'edit';
          editButton.dataset.name = name;

          const deleteButton = document.createElement('button');
          deleteButton.type = 'button';
          deleteButton.className = 'action-btn delete';
          deleteButton.textContent = 'D';
          deleteButton.setAttribute('aria-label', `Delete ${name}`);
          deleteButton.dataset.action = 'delete';
          deleteButton.dataset.name = name;

          actionCell.appendChild(editButton);
          actionCell.appendChild(deleteButton);

          row.appendChild(nameCell);
          row.appendChild(actionCell);
          tbodyEl.appendChild(row);
        });
      }

      function render() {
        updateHint();
        syncInputValue();
        renderTable();

        if (state.components.length === 0) {
          tableEl.classList.add('hidden');
          emptyStateEl.classList.remove('hidden');
        } else {
          tableEl.classList.remove('hidden');
          emptyStateEl.classList.add('hidden');
        }
      }

      function resetInput() {
        state.inputValue = '';
        inputEl.value = '';
        inputEl.focus();
      }

      function exitEditMode() {
        state.editingOriginalName = null;
        resetInput();
        render();
      }

      function beginEdit(name) {
        state.editingOriginalName = name;
        state.inputValue = name;
        syncInputValue();
        render();
        requestAnimationFrame(() => {
          inputEl.focus();
          inputEl.select();
        });
      }

      function handleCreate() {
        const normalized = normalizeName(state.inputValue);
        if (!normalized) {
          return;
        }

        const isDuplicate = state.components.some(
          (name) => normalizeName(name).toLowerCase() === normalized.toLowerCase()
        );

        if (isDuplicate) {
          state.inputValue = '';
          render();
          inputEl.focus();
          return;
        }

        state.components.push(normalized);
        state.components = sortComponents(state.components);
        saveComponents();
        state.inputValue = '';
        render();
        inputEl.focus();
      }

      function handleRename() {
        const normalized = normalizeName(state.inputValue);

        if (!normalized) {
          return;
        }

        if (normalized === state.editingOriginalName) {
          state.editingOriginalName = null;
          state.inputValue = '';
          render();
          inputEl.focus();
          return;
        }

        const existingName = state.components.find(
          (name) =>
            normalizeName(name).toLowerCase() === normalized.toLowerCase() &&
            name !== state.editingOriginalName
        );

        if (existingName) {
          state.components = state.components.filter(
            (name) => name !== state.editingOriginalName
          );
          state.components = sortComponents(state.components);
          saveComponents();
          state.editingOriginalName = null;
          state.inputValue = '';
          render();
          inputEl.focus();
          return;
        }

        state.components = state.components.map((name) =>
          name === state.editingOriginalName ? normalized : name
        );
        state.components = sortComponents(state.components);
        saveComponents();
        state.editingOriginalName = null;
        state.inputValue = '';
        render();
        inputEl.focus();
      }

      function handleDelete(name) {
        state.components = state.components.filter((item) => item !== name);

        if (state.editingOriginalName === name) {
          state.editingOriginalName = null;
          state.inputValue = '';
        }

        saveComponents();
        render();
      }

      function handleKeydown(event) {
        const { key } = event;

        if (key === 'Enter') {
          event.preventDefault();
          if (state.editingOriginalName) {
            handleRename();
          } else {
            handleCreate();
          }
          return;
        }

        if (key === 'Escape') {
          event.preventDefault();
          if (state.editingOriginalName) {
            state.editingOriginalName = null;
          }
          state.inputValue = '';
          render();
          inputEl.focus();
          return;
        }

        if (['Tab', 'ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End', 'Backspace', 'Delete'].includes(key)) {
          return;
        }

        if (key.length === 1 && !/[a-zA-Z ]/.test(key)) {
          event.preventDefault();
        }
      }

      function handleInput() {
        const selectionStart = inputEl.selectionStart ?? inputEl.value.length;
        const selectionEnd = inputEl.selectionEnd ?? selectionStart;
        const rawValue = inputEl.value;
        const formatted = formatInputValue(rawValue);

        inputEl.value = formatted;
        state.inputValue = formatted;
        inputEl.setSelectionRange(
          formatInputValue(rawValue.slice(0, selectionStart)).length,
          formatInputValue(rawValue.slice(0, selectionEnd)).length
        );

        if (state.editingOriginalName && normalizeName(formatted) === '') {
          exitEditMode();
          return;
        }

        render();
      }

      function handlePaste(event) {
        event.preventDefault();
        const pasted = event.clipboardData.getData('text');

        const selectionStart = inputEl.selectionStart;
        const selectionEnd = inputEl.selectionEnd;
        const currentValue = inputEl.value;
        const nextValue =
          currentValue.slice(0, selectionStart) + pasted + currentValue.slice(selectionEnd);
        const nextSelectionValue = currentValue.slice(0, selectionStart) + pasted;

        state.inputValue = formatInputValue(nextValue);
        inputEl.value = state.inputValue;
        render();
        const caretPosition = formatInputValue(nextSelectionValue).length;
        inputEl.setSelectionRange(caretPosition, caretPosition);
      }

      document.addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) {
          return;
        }

        const { action, name } = button.dataset;
        if (action === 'edit') {
          beginEdit(name);
          return;
        }

        if (action === 'delete') {
          handleDelete(name);
        }
      });

      inputEl.addEventListener('keydown', handleKeydown);
      inputEl.addEventListener('input', handleInput);
      inputEl.addEventListener('paste', handlePaste);
      exportBtn.addEventListener('click', () => {
        const raw = localStorage.getItem(STORAGE_KEY) || '[]';

        copyToClipboard(raw).then(() => {
          const originalText = exportBtn.textContent;
          exportBtn.textContent = 'Copied!';
          setTimeout(() => {
            exportBtn.textContent = originalText;
          }, 1500);
        });
      });
      importBtn.addEventListener('click', () => {
        if (importTextarea.classList.contains('hidden')) {
          openImportArea();
          return;
        }

        attemptImport();
      });
      importCancelBtn.addEventListener('click', closeImportArea);

      loadComponents();
      render();
      inputEl.focus();
    </script>
  </body>
</html>
